name: 发布到 B 站 Toy（需自备凭据）

# 原项目的第二发布通道，本 fork 保留，但默认不启用。
#
# 本仓库已改用 GitHub Pages 发布，没有原作者的 Toy 登录凭据，TOY_ID 也不是自己的应用。
# 若保留每日定时，它只会每天失败一次并自动开一条 issue。所以改成纯手动触发，
# 并用一个前置 job 检查 Secret：没配置就干净地跳过，整个运行仍是绿的。
#
# 想启用时：本机 `toy login`，把登录态写进仓库 Secret，并把下面 TOY_ID 改成自己的应用 ID：
#   node -p 'require(process.env.HOME+"/.toy/session.json").session_token' | gh secret set TOY_CLI_SESSION_TOKEN
# 然后在 Actions 页手动 Run workflow。判据（只在内容真有变化时才送审）见 scripts/toy/should-publish.ts。

on:
  workflow_dispatch:
    inputs:
      force:
        description: 内容没变也送审
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: toy
  cancel-in-progress: false

env:
  TOY_ID: '34090174887936'
  # 固定版本，升级 CLI 时改这里（最新版本号：https://boss.hdslb.com/toy-cli/toy/latest/VERSION）
  TOY_CLI_VERSION: v0.6.1
  TOY_NO_UPDATE_CHECK: '1'

jobs:
  # Secrets 不能直接写进 job 的 if 表达式，所以用一个前置 job 把「有没有凭据」变成 output。
  guard:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: 检查 Toy 凭据
        id: check
        env:
          TOY_CLI_SESSION_TOKEN: ${{ secrets.TOY_CLI_SESSION_TOKEN }}
        run: |
          if [ -z "$TOY_CLI_SESSION_TOKEN" ]; then
            echo "::notice::未配置 TOY_CLI_SESSION_TOKEN，跳过 B 站 Toy 发布；本仓库由 GitHub Pages 发布"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 安装 toy CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/toy" "https://boss.hdslb.com/toy-cli/toy/releases/${TOY_CLI_VERSION}/toy_linux_amd64"
          chmod +x "$RUNNER_TEMP/toy"
          echo "TOY_BIN=$RUNNER_TEMP/toy" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/toy" version

      - name: 判断要不要送审
        id: decide
        env:
          TOY_CLI_SESSION_TOKEN: ${{ secrets.TOY_CLI_SESSION_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: npx tsx scripts/toy/should-publish.ts

      - name: 安装浏览器
        if: steps.decide.outputs.publish == 'true'
        run: npx playwright install --with-deps chromium

      - name: 打包
        if: steps.decide.outputs.publish == 'true'
        run: npm run assets && npm run toy:build

      # 发版闸门：把包挂到与线上同构的版本化路径下，用真实浏览器把每个控件点一遍
      - name: 自检
        if: steps.decide.outputs.publish == 'true'
        run: npm run toy:verify

      - name: 提交审核
        if: steps.decide.outputs.publish == 'true'
        env:
          TOY_CLI_SESSION_TOKEN: ${{ secrets.TOY_CLI_SESSION_TOKEN }}
        run: '"$TOY_BIN" update "$TOY_ID" .toy-pkg --yes'

      - name: 失败时开 issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'B 站 Toy 自动发布失败';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `### ${new Date().toISOString()}`,
              '',
              `运行链接：${runUrl}`,
              '',
              '常见原因：上一版被驳回（先人工处理再手动发布一次）、登录凭据过期（本机 `toy login` 后更新 Secret，命令见工作流文件顶部）、自检没过。',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: ['`.github/workflows/toy.yml` 运行失败，每次失败都会在这里追加评论，修好后手动关闭。', '', body].join('\n'),
              });
            }
